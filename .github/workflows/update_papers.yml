name: Update Papers from arXiv

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Parse papers from arXiv
        run: |
          python3 -c '
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re

          url = "http://export.arxiv.org/api/query?search_query=au:Shahab_Shahidi&sortBy=submittedDate&sortOrder=descending&max_results=100"
          
          def standardize_journal(raw_text):
              if not raw_text:
                  return "arXiv Preprint"
              
              text = raw_text.strip().replace("\n", " ")
              lower = text.lower()
              
              # تبدیل نام‌های طولانی یا مختلف به اختصار استاندارد یا فرمت زیبا
              if "dark universe" in lower or "phys. dark univ" in lower:
                  name = "Phys. Dark Univ."
              elif "physical review d" in lower or "phys.rev.d" in lower or "prd" in lower:
                  name = "Phys. Rev. D"
              elif "european physical journal c" in lower or "eur. phys. j. c" in lower:
                  name = "Eur. Phys. J. C"
              elif "journal of cosmology and astroparticle physics" in lower or "jcap" in lower:
                  name = "JCAP"
              elif "physics letters b" in lower or "phys. lett. b" in lower:
                  name = "Phys. Lett. B"
              elif "classical and quantum gravity" in lower or "class. quantum grav" in lower:
                  name = "Class. Quantum Grav."
              elif "astrophysical journal" in lower or "astrophys. j." in lower:
                  name = "Astrophys. J."
              else:
                  # اگر مجله ناشناخته‌ای بود، متن اولیه را تمیز می‌کنیم
                  return text

              # تلاش برای استخراج جلد، صفحه و سال از متن ژورنال‌رف
              # مثال الگو: Phys. Dark Univ. 24 (2019) 100550 یا مشابه
              return text

          try:
              req = urllib.request.urlopen(url)
              xml_data = req.read()
              
              root = ET.fromstring(xml_data)
              ns = {
                  "atom": "http://www.w3.org/2005/Atom",
                  "arxiv": "http://arxiv.org/schemas/atom"
              }
              
              all_papers = []
              for entry in root.findall("atom:entry", ns):
                  title_elem = entry.find("atom:title", ns)
                  title = title_elem.text.strip().replace("\n", " ") if title_elem is not None else "Untitled"
                  
                  pub_elem = entry.find("atom:published", ns)
                  published = pub_elem.text[:4] if pub_elem is not None else ""
                  
                  id_elem = entry.find("atom:id", ns)
                  id_url = id_elem.text.strip() if id_elem is not None else ""
                  
                  doi_elem = entry.find("arxiv:doi", ns)
                  doi = doi_elem.text.strip() if doi_elem is not None else None
                  
                  # بررسی journal_ref یا comment
                  journal_raw = None
                  jref_elem = entry.find("arxiv:journal_ref", ns)
                  if jref_elem is not None and jref_elem.text:
                      journal_raw = jref_elem.text
                  else:
                      comm_elem = entry.find("arxiv:comment", ns)
                      if comm_elem is not None and comm_elem.text:
                          c_text = comm_elem.text
                          for prefix in ["published in", "accepted in", "to appear in"]:
                              if prefix in c_text.lower():
                                  journal_raw = c_text
                                  break
                  
                  journal = standardize_journal(journal_raw)
                  
                  authors = [author.find("atom:name", ns).text for author in entry.findall("atom:author", ns) if author.find("atom:name", ns) is not None]
                  authors_str = ", ".join(authors)
                  
                  all_papers.append({
                      "title": title,
                      "authors": authors_str,
                      "journal": journal,
                      "year": published,
                      "url": id_url,
                      "doi": doi
                  })
              
              with open("all_papers.json", "w", encoding="utf-8") as f:
                  json.dump(all_papers, f, ensure_ascii=False, indent=2)

              with open("papers.json", "w", encoding="utf-8") as f:
                  json.dump(all_papers[:2], f, ensure_ascii=False, indent=2)

              print(f"Successfully generated {len(all_papers)} papers.")
          except Exception as e:
              print("Error:", e)
              exit(1)
          '

      - name: Commit and push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add all_papers.json papers.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Standardize journal references" && git push)
