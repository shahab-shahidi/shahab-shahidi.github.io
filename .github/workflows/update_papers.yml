name: Update Papers from arXiv

on:
  schedule:
    # Run everyday at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  fetch-arxiv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch arXiv Papers & Normalize Citations
        run: |
          python - << 'EOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re

          def clean_author_name(name):
              parts = [p.strip() for p in name.split(',') if p.strip()]
              if len(parts) == 2:
                  return f"{parts[1]} {parts[0]}"
              return name.strip()

          def normalize_journal(ref_str, default_year=""):
              if not ref_str:
                  return "arXiv Preprint"
              
              clean_ref = re.sub(r'[\r\n\t]+', ' ', ref_str).strip()
              clean_ref = re.sub(r'\s+', ' ', clean_ref)

              # Dictionary mapping variations/keywords to canonical abbreviations
              journal_map = [
                  (r'phys(ical)?\.?\s*rev(iew)?\.?\s*d', 'PRD'),
                  (r'phys(ical)?\.?\s*rev(iew)?\.?\s*lett(ers)?', 'PRL'),
                  (r'phys(ical)?\.?\s*rev(iew)?\.?\s*b', 'PRB'),
                  (r'phys(ical)?\.?\s*rev(iew)?\.?\s*c', 'PRC'),
                  (r'phys(ical)?\.?\s*rev(iew)?\.?\s*x', 'PRX'),
                  (r'phys(ical)?\.?\s*rev(iew)?\.?\s*research', 'PRResearch'),
                  (r'(the\s+)?eur(opean)?\.?\s*phys(ical)?\.?\s*j(ournal)?\.?\s*c', 'EPJC'),
                  (r'dark\s*universe|phys(ics)?\.?\s*dark\s*univ(erse)?', 'PDU'),
                  (r'j(ournal\s+of\s+)?c(osmology\s+and\s+)?a(stroparticle\s+)?p(hysics)?', 'JCAP'),
                  (r'j(ournal\s+of\s+)?h(igh\s+)?e(nergy\s+)?a(strophysics)?', 'JHEAP'),
                  (r'j(ournal\s+of\s+)?h(igh\s+)?e(nergy\s+)?p(hysics)?', 'JHEP'),
                  (r'mon(thly)?\.?\s*not(ices)?\.?\s*(roy(al)?\.?\s*astron(omical)?\.?\s*soc(iety)?)?|mnras', 'MNRAS'),
                  (r'astrophys(ical)?\.?\s*j(ournal)?\.?\s*suppl(ement)?', 'ApJS'),
                  (r'astrophys(ical)?\.?\s*j(ournal)?\.?\s*lett(ers)?', 'ApJL'),
                  (r'astrophys(ical)?\.?\s*j(ournal)?', 'ApJ'),
                  (r'gen(eral)?\.?\s*rel(ativity)?\.?\s*(and\s+)?grav(itation)?', 'GRG'),
                  (r'class(ical)?\.?\s*(and\s+)?quant(um)?\.?\s*grav(ity)?', 'CQG'),
                  (r'ann(als)?\.?\s*phys(ics)?', 'Annals Phys.'),
                  (r'nuclear\s+phys(ics)?\.?\s*b|nucl\.?\s*phys\.?\s*b', 'Nucl. Phys. B'),
                  (r'phys(ics)?\.?\s*lett(ers)?\.?\s*b', 'PLB'),
                  (r'universe', 'Universe'),
                  (r'astron(omy)?\.?\s*(&|and)\s*astrophys(ics)?', 'A&A'),
                  (r'front(iers)?\.?\s*in\s*phys(ics)?', 'Front. Phys.'),
                  (r'fortschr(itte)?\.?\s*phys(ik)?', 'Fortsch. Phys.'),
                  (r'symmetry', 'Symmetry'),
                  (r'entropy', 'Entropy'),
              ]

              identified_j = None
              matched_pattern = ""
              for pattern, abbrev in journal_map:
                  m = re.search(r'\b' + pattern + r'\b', clean_ref, re.IGNORECASE)
                  if m:
                      identified_j = abbrev
                      matched_pattern = m.group(0)
                      break

              if not identified_j:
                  # If no major journal matched, clean up trailing junk
                  fallback = re.sub(r'^(published\s+in:?|to\s+appear\s+in:?|accepted\s+by:?)\s*', '', clean_ref, flags=re.IGNORECASE)
                  return fallback if len(fallback) > 3 else "arXiv Preprint"

              # Isolate the citation specs following or surrounding the journal name
              specs = clean_ref.replace(matched_pattern, ' ')

              # Format A: Multidisciplinary/MDPI style: e.g. "Universe 2025, 11(7), 198" or "2025, 11, 198"
              # Match Year, Volume, optional issue, and page/article ID
              p_mdpi = re.search(r'(?:^|[,\s])(?P<year>(?:19|20)\d{2})[,\s]+(?P<vol>\d+)(?:\((?P<issue>\w+)\))?[,\s]+(?P<page>[a-zA-Z0-9_\.\-]+)', specs)
              if p_mdpi:
                  v = p_mdpi.group('vol')
                  y = p_mdpi.group('year')
                  p = p_mdpi.group('page')
                  return f"{identified_j} {v} ({y}) {p}"

              # Format B: Traditional HEP citation style: e.g. "EPJC 81 (2021) 274" or "PRD 107, 064008 (2023)"
              p_hep1 = re.search(r'(?:vol(?:ume|\.)?\s*)?(?P<vol>\d+)[,\s]*(?:\((?:no\.\s*)?\w+\))?[,\s]*\((?P<year>(?:19|20)\d{2})\)[,\s]*(?:id\.?\s*|no\.?\s*)?(?P<page>[a-zA-Z0-9_\.\-]+)', specs, re.IGNORECASE)
              if p_hep1:
                  v = p_hep1.group('vol')
                  y = p_hep1.group('year')
                  p = p_hep1.group('page')
                  return f"{identified_j} {v} ({y}) {p}"

              # Format C: Volume, page, (year): e.g. "PRD 98, 084025 (2018)"
              p_hep2 = re.search(r'(?:vol(?:ume|\.)?\s*)?(?P<vol>\d+)[,\s]*(?:id\.?\s*|no\.?\s*)?(?P<page>[a-zA-Z0-9_\.\-]+)[,\s]*\((?P<year>(?:19|20)\d{2})\)', specs, re.IGNORECASE)
              if p_hep2:
                  v = p_hep2.group('vol')
                  y = p_hep2.group('year')
                  p = p_hep2.group('page')
                  return f"{identified_j} {v} ({y}) {p}"

              # Format D: Generic extraction of numbers if strict structure varied
              vol_m = re.search(r'(?:vol(?:ume|\.)?\s*)(\d+)', specs, re.IGNORECASE)
              year_m = re.search(r'\b((?:19|20)\d{2})\b', specs)
              page_m = re.search(r'(?:id\.?\s*|page\s*|art(icle)?\.?\s*|no\.?\s*)([a-zA-Z0-9_\.\-]+)', specs, re.IGNORECASE)

              year = year_m.group(1) if year_m else default_year
              vol = vol_m.group(1) if vol_m else ""
              page = page_m.group(2) if page_m else ""

              if vol and page:
                  return f"{identified_j} {vol} ({year}) {page}" if year else f"{identified_j} {vol} {page}"
              elif vol:
                  return f"{identified_j} {vol} ({year})" if year else f"{identified_j} {vol}"

              return identified_j

          # arXiv API Query
          url = "http://export.arxiv.org/api/query?search_query=au:Shahab_Shahidi&sortBy=submittedDate&sortOrder=descending&max_results=100"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Academic CV updater)'})
          response = urllib.request.urlopen(req)
          xml_data = response.read()

          root = ET.fromstring(xml_data)
          ns = {
              'atom': 'http://www.w3.org/2005/Atom',
              'arxiv': 'http://arxiv.org/xmlns/arxiv'
          }

          entries = root.findall('atom:entry', ns)
          papers = []

          for entry in entries:
              title = entry.find('atom:title', ns).text
              title = re.sub(r'\s+', ' ', title).strip()

              authors = [clean_author_name(author.find('atom:name', ns).text) for author in entry.findall('atom:author', ns)]
              authors_str = ", ".join(authors)

              published = entry.find('atom:published', ns).text
              year = published.split('-')[0] if published else ""

              link_node = entry.find("atom:link[@rel='alternate']", ns)
              url_link = link_node.attrib['href'] if link_node is not None else ""

              doi_node = entry.find('arxiv:doi', ns)
              doi = doi_node.text.strip() if doi_node is not None else None

              journal_node = entry.find('arxiv:journal_ref', ns)
              comment_node = entry.find('arxiv:comment', ns)

              ref_source = ""
              if journal_node is not None and journal_node.text:
                  ref_source = journal_node.text
              elif comment_node is not None and comment_node.text:
                  # Check if comment contains publication hint
                  if re.search(r'(published|accepted|appear|phys|jcap|jhep|jheap|mnras|universe|prd|epjc|cqg)', comment_node.text, re.IGNORECASE):
                      ref_source = comment_node.text

              journal_clean = normalize_journal(ref_source, default_year=year)

              papers.append({
                  "title": title,
                  "authors": authors_str,
                  "journal": journal_clean,
                  "year": year,
                  "url": url_link,
                  "doi": f"https://doi.org/{doi}" if doi else None
              })

          # 1. Save all papers for publications.html
          with open('all_papers.json', 'w', encoding='utf-8') as f:
              json.dump(papers, f, ensure_ascii=False, indent=2)

          # 2. Save latest 2 papers for index.html hero section
          with open('papers.json', 'w', encoding='utf-8') as f:
              json.dump(papers[:2], f, ensure_ascii=False, indent=2)

          print(f"Successfully processed {len(papers)} papers.")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add papers.json all_papers.json
          if git diff-index --quiet HEAD --; then
            echo "No changes in papers to commit."
          else
            git commit -m "Auto-update publications: standardized journal citations [skip ci]"
            git push
          fi
