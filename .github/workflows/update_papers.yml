name: Update Papers JSON

on:
  schedule:
    - cron: '0 0 * * 0' # هر هفته یکبار
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch latest papers from INSPIRE-HEP
        run: |
          curl -s "https://inspirehep.net/api/literature?sort=mostrecent&size=2&q=ea:1066053" -o inspire_raw.json
          # اینجا می‌توانید پایتون اسکریپت برای تبدیل JSON اینسپایر به فرمت دلخواه قرار دهید

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add papers.json
          git commit -m "Auto-update latest papers" || exit 0
          git push
